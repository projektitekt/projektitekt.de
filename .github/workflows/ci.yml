name: CI

on:
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    - cron:  '0 3 * * *' # daily, at 3am

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 12.x

      - uses: pnpm/action-setup@3236b209b507b249883918e7c4c8c7cdd2c0d5db # v2.0.0
        with:
          version: 6.0.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 12.x

      - uses: pnpm/action-setup@3236b209b507b249883918e7c4c8c7cdd2c0d5db # v2.0.0
        with:
          version: 6.0.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
